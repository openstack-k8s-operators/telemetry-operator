<VirtualHost *:8989>
  ServerName aetos.openstack.svc

  ## Vhost docroot
  DocumentRoot "/var/www/cgi-bin/aetos"

  ## Directories, there should at least be a declaration for /var/www/cgi-bin/aetos

  <Directory "/var/www/cgi-bin/aetos">
    Options -Indexes +FollowSymLinks +MultiViews
    AllowOverride None
    Require all granted
  </Directory>

  ## Logging
  ErrorLog /dev/stdout
  ServerSignature Off
  SetEnvIf X-Forwarded-For "^.*\..*\..*\..*" forwarded
  CustomLog /dev/stdout combined env=!forwarded
  CustomLog /dev/stdout proxy env=forwarded

  ## Request header rules
  ## as per http://httpd.apache.org/docs/2.2/mod/mod_headers.html#requestheader
  RequestHeader setIfEmpty X-Forwarded-Proto "http"

  ## WSGI configuration
  WSGIApplicationGroup %{GLOBAL}
  WSGIDaemonProcess aetos display-name=aetos group=aetos processes=3 threads=1 user=aetos
  WSGIProcessGroup aetos
  WSGIScriptAlias / "/var/www/cgi-bin/aetos/aetos-api"
  WSGIPassAuthorization On
</VirtualHost>
