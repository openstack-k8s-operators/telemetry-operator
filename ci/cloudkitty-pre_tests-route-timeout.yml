---
- name: "Raise the OpenShift router timeout for the cloudkitty public route"
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  gather_facts: true
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig | default(ansible_env.HOME + '/.kube/config') }}"
    PATH: "{{ cifmw_path | default(ansible_env.PATH) }}"
  tasks:
    # The OpenShift router (HAProxy) applies a 60s timeout to proxied
    # requests (the route carries haproxy.router.openshift.io/timeout=60s).
    # Fetching all dataframes from Loki through the cloudkitty API
    # (GET /v1/storage/dataframes/) can take longer than that, which makes
    # the tempest test_get_storage_dataframes test fail intermittently with
    # a 504 generated by the router itself. Overwrite the timeout annotation
    # on the cloudkitty public route so slow-but-successful responses are
    # not cut at 60s.
    - name: Wait for the cloudkitty public route to be created
      ansible.builtin.command:
        cmd: oc get route cloudkitty-public -n openstack -o name
      register: _route_check
      until: _route_check.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Annotate the cloudkitty public route with the router timeout
      ansible.builtin.command:
        cmd: >-
          oc annotate --overwrite route cloudkitty-public -n openstack
          haproxy.router.openshift.io/timeout=300s
      changed_when: true

    - name: Verify the router timeout annotation
      ansible.builtin.command:
        cmd: >-
          oc get route cloudkitty-public -n openstack
          -o jsonpath={.metadata.annotations.haproxy\.router\.openshift\.io/timeout}
      register: _route_timeout
      changed_when: false

    - name: Assert the router timeout annotation was applied
      ansible.builtin.assert:
        that: _route_timeout.stdout == "300s"
        fail_msg: >-
          The haproxy.router.openshift.io/timeout annotation on the
          cloudkitty public route could not be verified: {{ _route_timeout.stdout }}
        success_msg: "haproxy.router.openshift.io/timeout is 300s on the cloudkitty public route"
