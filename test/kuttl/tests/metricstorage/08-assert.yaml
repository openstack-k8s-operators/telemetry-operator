apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 900
commands:
  - script: |-
      set -euo pipefail
      NS="${NAMESPACE}"

      echo "Waiting for KeystoneApplicationCredential ac-aetos to be Ready..."
      oc wait -n "${NS}" appcred/ac-aetos --for=condition=Ready --timeout=300s

      ac_id=$(oc get -n "${NS}" appcred/ac-aetos -o jsonpath='{.status.acID}')
      if [ -z "${ac_id}" ]; then
        echo "ERROR: appcred/ac-aetos.status.acID is empty"
        exit 1
      fi
      echo "ac-aetos.status.acID=${ac_id}"

      ac_secret_name=$(oc get -n "${NS}" appcred/ac-aetos -o jsonpath='{.status.secretName}')
      if [ -z "${ac_secret_name}" ]; then
        echo "ERROR: appcred/ac-aetos.status.secretName is empty"
        exit 1
      fi
      echo "AC secret name: ${ac_secret_name}"

      # Verify secret exists with correct AC_ID
      oc get -n "${NS}" secret/"${ac_secret_name}" >/dev/null
      secret_ac_id=$(oc get -n "${NS}" secret/"${ac_secret_name}" -o jsonpath='{.data.AC_ID}' | base64 -d)
      if [ "${secret_ac_id}" != "${ac_id}" ]; then
        echo "ERROR: Secret AC_ID (${secret_ac_id}) != appcred.status.acID (${ac_id})"
        exit 1
      fi
      echo "✓ Secret AC_ID matches appcred.status.acID"

      # Wait for the Prometheus pod (with Aetos sidecar) to be restarted
      echo "Waiting for Prometheus pod to be recreated with updated Aetos config..."
      old_pod_uid=$(oc get -n "${NS}" configmap/appcred-aetos-pre -o jsonpath='{.data.pod_uid}')
      for _ in $(seq 1 60); do
        new_pod_uid=$(oc get pod -n "${NS}" prometheus-telemetry-kuttl-0 -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
        if [ -n "${new_pod_uid}" ] && [ "${new_pod_uid}" != "${old_pod_uid}" ]; then
          break
        fi
        sleep 5
      done
      new_pod_uid=$(oc get pod -n "${NS}" prometheus-telemetry-kuttl-0 -o jsonpath='{.metadata.uid}')
      if [ "${old_pod_uid}" = "${new_pod_uid}" ]; then
        echo "ERROR: expected Prometheus pod to restart after appcred secret became available"
        echo "  pod: ${old_pod_uid} -> ${new_pod_uid}"
        exit 1
      fi
      echo "✓ Prometheus pod restarted after appcred secret became available"

      # Wait for the Aetos container to be ready
      oc wait -n "${NS}" pod/prometheus-telemetry-kuttl-0 \
        --for=jsonpath='{.status.containerStatuses[?(@.name=="aetos")].ready}'=true --timeout=300s

      # Verify config contains application_credential_id
      echo "Checking aetos config contains application_credential_id..."
      oc exec -n "${NS}" pod/prometheus-telemetry-kuttl-0 -c aetos -- \
        bash -c "grep -q 'application_credential_id = ${ac_id}' /etc/aetos/aetos.conf"
      echo "✓ aetos config contains expected application_credential_id"

      # Verify auth_type is v3applicationcredential
      echo "Checking aetos config contains auth_type = v3applicationcredential..."
      oc exec -n "${NS}" pod/prometheus-telemetry-kuttl-0 -c aetos -- \
        bash -c "grep -q 'auth_type = v3applicationcredential' /etc/aetos/aetos.conf"
      echo "✓ aetos config contains auth_type = v3applicationcredential"
