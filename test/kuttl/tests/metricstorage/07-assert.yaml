# Dashboards are re-enabled at step 06 with the power-monitoring EDPM resources
# deployed, so the full set of managed Perses objects must exist: the
# datasource and every dashboard in the operator's registry, including
# ceilometer-ipmi, which is only created when a nodeset runs the
# telemetry-power-monitoring service.
#
# Each dashboard is asserted with its display name and its controller
# reference, so the test fails if a definition is rejected by the perses.dev
# CRD validation, is built with the wrong content, or is created without the
# ownership the garbage collection and the ownership-aware deletion rely on.
apiVersion: perses.dev/v1alpha1
kind: PersesDatasource
metadata:
  name: prometheus
  ownerReferences:
  - kind: MetricStorage
    name: telemetry-kuttl
    controller: true
spec:
  config:
    default: true
    plugin:
      kind: PrometheusDatasource
---
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: openstack-cloud
  ownerReferences:
  - kind: MetricStorage
    name: telemetry-kuttl
    controller: true
spec:
  display:
    name: Openstack / Node Exporter / USE Method / Cluster
---
