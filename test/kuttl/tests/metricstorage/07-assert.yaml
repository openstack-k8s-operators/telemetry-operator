# Dashboards are re-enabled at step 06 with the power-monitoring EDPM resources
# deployed. Assert the managed Perses objects: the datasource, the
# openstack-cloud dashboard and the ceilometer-ipmi dashboard, which is only
# created when a nodeset runs the telemetry-power-monitoring service.
apiVersion: perses.dev/v1alpha1
kind: PersesDatasource
metadata:
  name: prometheus
spec:
  config:
    default: true
    plugin:
      kind: PrometheusDatasource
---
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: openstack-cloud
---
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: openstack-ceilometer-ipmi
spec:
  display:
    name: OpenStack / Compute Power Monitoring / Ceilometer IPMI
