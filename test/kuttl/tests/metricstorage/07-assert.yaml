# Dashboards are re-enabled at step 06 with the power-monitoring EDPM resources
# deployed. Assert exactly the managed Perses objects that should exist: the
# datasource and the implemented openstack-cloud dashboard.
apiVersion: perses.dev/v1alpha1
kind: PersesDatasource
metadata:
  name: prometheus
spec:
  config:
    default: true
    plugin:
      kind: PrometheusDatasource
---
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: openstack-cloud
