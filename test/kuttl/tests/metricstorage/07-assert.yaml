# Dashboards are re-enabled at step 06 with the power-monitoring EDPM resources
# deployed. Assert the managed Perses datasource and dashboards are present. The
# power-monitoring (ceilometer-ipmi) dashboard is not yet available as a Perses
# dashboard; its absence is asserted in 07-errors.yaml.
apiVersion: perses.dev/v1alpha1
kind: PersesDatasource
metadata:
  name: prometheus
spec:
  config:
    default: true
    plugin:
      kind: PrometheusDatasource
---
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: openstack-cloud
