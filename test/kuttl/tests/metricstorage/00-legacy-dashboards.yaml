# Pre-create the ConfigMap-based dashboard artifacts that earlier versions of
# the operator delivered in openshift-config-managed, before the MetricStorage
# is deployed in step 01, to simulate an upgrade. 01-errors asserts the
# operator removes them.
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    console.openshift.io/dashboard-datasource: "true"
  name: telemetry-kuttl-tests-telemetry-kuttl-datasource
  namespace: openshift-config-managed
---
