apiVersion: v1
kind: Pod
metadata:
  labels:
    service: aodh
  name: aodh-0
  ownerReferences:
  - kind: StatefulSet
    name: aodh
spec:
  containers:
    - name: aodh-api
      command:
        - /usr/sbin/httpd
      args:
        - -DFOREGROUND
      volumeMounts:
        - mountPath: /etc/aodh/aodh.conf
          name: config-data
          readOnly: true
          subPath: aodh.conf
        - mountPath: /etc/aodh/aodh.conf.d/01-aodh-custom.conf
          name: config-data
          readOnly: true
          subPath: custom.conf
        - mountPath: /etc/httpd/conf.d/00wsgi-aodh.conf
          name: config-data
          readOnly: true
          subPath: wsgi-aodh.conf
        - mountPath: /etc/httpd/conf/httpd.conf
          name: config-data
          readOnly: true
          subPath: httpd.conf
        - mountPath: /etc/httpd/conf.d/ssl.conf
          name: config-data
          readOnly: true
          subPath: ssl.conf
        - mountPath: /etc/my.cnf
          name: config-data
          readOnly: true
          subPath: my.cnf
        - mountPath: /run/httpd
          name: run-httpd
        - mountPath: /var/log/httpd
          name: var-log-httpd
        - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          name: combined-ca-bundle
          readOnly: true
          subPath: tls-ca-bundle.pem
        - mountPath: /etc/pki/tls/certs/internal.crt
          name: internal-tls-certs
          readOnly: true
          subPath: tls.crt
        - mountPath: /etc/pki/tls/private/internal.key
          name: internal-tls-certs
          readOnly: true
          subPath: tls.key
        - mountPath: /etc/pki/tls/certs/public.crt
          name: public-tls-certs
          readOnly: true
          subPath: tls.crt
        - mountPath: /etc/pki/tls/private/public.key
          name: public-tls-certs
          readOnly: true
          subPath: tls.key
    - name: aodh-evaluator
      command:
        - /usr/bin/aodh-evaluator
      args:
        - --logfile
        - /dev/stdout
      volumeMounts:
        - mountPath: /etc/aodh/aodh.conf
          name: config-data
          readOnly: true
          subPath: aodh.conf
        - mountPath: /etc/aodh/aodh.conf.d/01-aodh-custom.conf
          name: config-data
          readOnly: true
          subPath: custom.conf
        - mountPath: /etc/openstack/prometheus.yaml
          name: config-data
          readOnly: true
          subPath: prometheus.yaml
        - mountPath: /etc/my.cnf
          name: config-data
          readOnly: true
          subPath: my.cnf
        - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          name: combined-ca-bundle
          readOnly: true
          subPath: tls-ca-bundle.pem
    - name: aodh-notifier
      command:
        - /usr/bin/aodh-notifier
      args:
        - --logfile
        - /dev/stdout
      volumeMounts:
        - mountPath: /etc/aodh/aodh.conf
          name: config-data
          readOnly: true
          subPath: aodh.conf
        - mountPath: /etc/aodh/aodh.conf.d/01-aodh-custom.conf
          name: config-data
          readOnly: true
          subPath: custom.conf
        - mountPath: /etc/my.cnf
          name: config-data
          readOnly: true
          subPath: my.cnf
        - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          name: combined-ca-bundle
          readOnly: true
          subPath: tls-ca-bundle.pem
    - name: aodh-listener
      command:
        - /usr/bin/aodh-listener
      args:
        - --logfile
        - /dev/stdout
      volumeMounts:
        - mountPath: /etc/aodh/aodh.conf
          name: config-data
          readOnly: true
          subPath: aodh.conf
        - mountPath: /etc/aodh/aodh.conf.d/01-aodh-custom.conf
          name: config-data
          readOnly: true
          subPath: custom.conf
        - mountPath: /etc/my.cnf
          name: config-data
          readOnly: true
          subPath: my.cnf
        - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          name: combined-ca-bundle
          readOnly: true
          subPath: tls-ca-bundle.pem
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    service: ceilometer
  name: ceilometer-0
  ownerReferences:
  - kind: StatefulSet
    name: ceilometer
spec:
  containers:
    - name: ceilometer-central-agent
      args:
        - --polling-namespaces
        - central
        - --logfile
        - /dev/stdout
      command:
        - /usr/bin/ceilometer-polling
      volumeMounts:
        - mountPath: /etc/ceilometer/ceilometer.conf
          name: config-data
          readOnly: true
          subPath: ceilometer.conf
        - mountPath: /etc/ceilometer/polling.yaml
          name: config-data
          readOnly: true
          subPath: polling.yaml.j2
        - mountPath: /etc/ceilometer/ceilometer.conf.d/01-ceilometer-custom.conf
          name: config-data
          readOnly: true
          subPath: custom.conf
        - mountPath: /var/lib/openstack/bin/centralhealth.py
          name: scripts
          readOnly: true
          subPath: centralhealth.py
        - mountPath: /var/lib/openstack/bin/notificationhealth.py
          name: scripts
          readOnly: true
          subPath: notificationhealth.py
        - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          name: combined-ca-bundle
          readOnly: true
          subPath: tls-ca-bundle.pem
    - name: ceilometer-notification-agent
      args:
        - --logfile
        - /dev/stdout
      command:
        - /usr/bin/ceilometer-agent-notification
      volumeMounts:
        - mountPath: /etc/ceilometer/ceilometer.conf
          name: config-data
          readOnly: true
          subPath: ceilometer.conf
        - mountPath: /etc/ceilometer/pipeline.yaml
          name: config-data
          readOnly: true
          subPath: pipeline.yaml
        - mountPath: /etc/ceilometer/event_pipeline.yaml
          name: config-data
          readOnly: true
          subPath: event_pipeline.yaml
        - mountPath: /etc/ceilometer/ceilometer.conf.d/01-ceilometer-custom.conf
          name: config-data
          readOnly: true
          subPath: custom.conf
        - mountPath: /var/lib/openstack/bin/centralhealth.py
          name: scripts
          readOnly: true
          subPath: centralhealth.py
        - mountPath: /var/lib/openstack/bin/notificationhealth.py
          name: scripts
          readOnly: true
          subPath: notificationhealth.py
        - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          name: combined-ca-bundle
          readOnly: true
          subPath: tls-ca-bundle.pem
    - name: sg-core
      volumeMounts:
        - mountPath: /etc/sg-core.conf.yaml
          name: sg-core-conf-yaml
          subPath: sg-core.conf.yaml
    - name: proxy-httpd
      args:
      - -DFOREGROUND
      command:
      - /usr/sbin/httpd
      volumeMounts:
        - mountPath: /etc/httpd/conf/httpd.conf
          name: config-data
          readOnly: true
          subPath: httpd.conf
        - mountPath: /etc/httpd/conf.d/ssl.conf
          name: config-data
          readOnly: true
          subPath: ssl.conf
        - mountPath: /run/httpd
          name: run-httpd
        - mountPath: /var/log/httpd
          name: var-log-httpd
        - mountPath: /etc/pki/tls/certs/tls.crt
          name: ceilometer-tls-certs
          readOnly: true
          subPath: tls.crt
        - mountPath: /etc/pki/tls/private/tls.key
          name: ceilometer-tls-certs
          readOnly: true
          subPath: tls.key
        - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          name: combined-ca-bundle
          readOnly: true
          subPath: tls-ca-bundle.pem
---
apiVersion: v1
kind: Pod
metadata:
  name: prometheus-telemetry-kuttl-metricstorage-0
  ownerReferences:
  - kind: StatefulSet
    name: prometheus-telemetry-kuttl-metricstorage
spec:
    containers:
    - name: prometheus
      volumeMounts:
      - mountPath: /etc/prometheus/config_out
        name: config-out
        readOnly: true
      - mountPath: /etc/prometheus/certs
        name: tls-assets
        readOnly: true
      - mountPath: /prometheus
        name: prometheus-telemetry-kuttl-metricstorage-db
      - mountPath: /etc/prometheus/secrets/combined-ca-bundle
        name: secret-combined-ca-bundle
        readOnly: true
      - mountPath: /etc/prometheus/secrets/cert-metric-storage-alertmanager-svc
        name: secret-cert-metric-storage-alertmanager-svc
        readOnly: true
      - mountPath: /etc/prometheus/rules/prometheus-telemetry-kuttl-metricstorage-rulefiles-0
        name: prometheus-telemetry-kuttl-metricstorage-rulefiles-0
      - mountPath: /etc/prometheus/rules/prometheus-telemetry-kuttl-metricstorage-rulefiles-1
        name: prometheus-telemetry-kuttl-metricstorage-rulefiles-1
      - mountPath: /etc/prometheus/rules/prometheus-telemetry-kuttl-metricstorage-rulefiles-2
        name: prometheus-telemetry-kuttl-metricstorage-rulefiles-2
      - mountPath: /etc/prometheus/web_config/web-config.yaml
        name: web-config
        readOnly: true
        subPath: web-config.yaml
      - mountPath: /etc/prometheus/web_config/secret/cert-metric-storage-prometheus-svc-key
        readOnly: true
      - mountPath: /etc/prometheus/web_config/secret/cert-metric-storage-prometheus-svc-cert
        readOnly: true
      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true
    - name: config-reloader
    - name: thanos-sidecar
---
apiVersion: monitoring.rhobs/v1alpha1
kind: MonitoringStack
metadata:
  name: telemetry-kuttl-metricstorage
  ownerReferences:
  - kind: MetricStorage
    name: telemetry-kuttl-metricstorage
spec:
  alertmanagerConfig:
    disabled: false
    webTLSConfig:
      privateKey:
        name: cert-metric-storage-alertmanager-svc
        key: tls.key
      certificate:
        name: cert-metric-storage-alertmanager-svc
        key: tls.crt
      certificateAuthority:
        name: cert-metric-storage-alertmanager-svc
        key: ca.crt
  prometheusConfig:
    webTLSConfig:
      privateKey:
        name: cert-metric-storage-prometheus-svc
        key: tls.key
      certificate:
        name: cert-metric-storage-prometheus-svc
        key: tls.crt
      certificateAuthority:
        name: combined-ca-bundle
        key: tls-ca-bundle.pem
---
apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  labels:
    service: metricStorage
  name: telemetry-ceilometer
  ownerReferences:
  - kind: MetricStorage
    name: telemetry-kuttl-metricstorage
spec:
  scheme: HTTPS
  tlsConfig:
    ca:
      secret:
        key: tls-ca-bundle.pem
        name: combined-ca-bundle
    cert:
      secret:
        key: tls.crt
        name: cert-prometheus-client
    keySecret:
      key: tls.key
      name: cert-prometheus-client
---
apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  labels:
    service: metricStorage
  name: telemetry-node-exporter-tls
  ownerReferences:
  - kind: MetricStorage
    name: telemetry-kuttl-metricstorage
spec:
  scheme: HTTPS
  tlsConfig:
    ca:
      secret:
        key: tls-ca-bundle.pem
        name: combined-ca-bundle
    cert:
      secret:
        key: tls.crt
        name: cert-prometheus-client
    keySecret:
      key: tls.key
      name: cert-prometheus-client
---
apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  labels:
    service: metricStorage
  name: telemetry-rabbitmq
  ownerReferences:
  - kind: MetricStorage
    name: telemetry-kuttl-metricstorage
spec:
  scheme: HTTPS
  tlsConfig:
    ca:
      secret:
        key: tls-ca-bundle.pem
        name: combined-ca-bundle
---
apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  labels:
    service: metricStorage
  name: telemetry-node-exporter
  ownerReferences:
  - kind: MetricStorage
    name: telemetry-kuttl-metricstorage
---
