---
apiVersion: v1
kind: Pod
metadata:
  labels:
    service: aodh
  name: aodh-0
  ownerReferences:
  - kind: StatefulSet
    name: aodh
spec:
  containers:
  - name: aodh-api
    volumeMounts:
    - mountPath: /etc/aodh/aodh.conf
      name: config-data
      subPath: aodh.conf
    - mountPath: /etc/aodh/aodh.conf.d/01-aodh-custom.conf
      name: config-data
      subPath: custom.conf
    - mountPath: /etc/httpd/conf.d/00wsgi-aodh.conf
      name: config-data
      subPath: wsgi-aodh.conf
    - mountPath: /etc/httpd/conf/httpd.conf
      name: config-data
      subPath: httpd.conf
    - mountPath: /etc/httpd/conf.d/ssl.conf
      name: config-data
      subPath: ssl.conf
    - mountPath: /etc/my.cnf
      name: config-data
      subPath: my.cnf
    - mountPath: /run/httpd
      name: run-httpd
    - mountPath: /var/log/httpd
      name: var-log-httpd
    - mountPath: /etc/aodh/policy.yaml
      name: custom-config
      subPath: policy.yaml
  - name: aodh-evaluator
    volumeMounts:
    - mountPath: /etc/aodh/aodh.conf
      name: config-data
      subPath: aodh.conf
    - mountPath: /etc/aodh/aodh.conf.d/01-aodh-custom.conf
      name: config-data
      subPath: custom.conf
    - mountPath: /etc/openstack/prometheus.yaml
      name: config-data
      subPath: prometheus.yaml
    - mountPath: /etc/my.cnf
      name: config-data
      subPath: my.cnf
    - mountPath: /etc/aodh/policy.yaml
      name: custom-config
      subPath: policy.yaml
  - name: aodh-notifier
    volumeMounts:
    - mountPath: /etc/aodh/aodh.conf
      name: config-data
      subPath: aodh.conf
    - mountPath: /etc/aodh/aodh.conf.d/01-aodh-custom.conf
      name: config-data
      subPath: custom.conf
    - mountPath: /etc/my.cnf
      name: config-data
      subPath: my.cnf
    - mountPath: /etc/aodh/policy.yaml
      name: custom-config
      subPath: policy.yaml
  - name: aodh-listener
    volumeMounts:
    - mountPath: /etc/aodh/aodh.conf
      name: config-data
      subPath: aodh.conf
    - mountPath: /etc/aodh/aodh.conf.d/01-aodh-custom.conf
      name: config-data
      subPath: custom.conf
    - mountPath: /etc/my.cnf
      name: config-data
      subPath: my.cnf
    - mountPath: /etc/aodh/policy.yaml
      name: custom-config
      subPath: policy.yaml
  volumes:
  - name: config-data
    secret:
      secretName: aodh-config-data
  - emptyDir: {}
    name: run-httpd
  - emptyDir: {}
    name: var-log-httpd
  - name: custom-config
    secret:
      secretName: custom-config
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: >
      test "$(oc -n $NAMESPACE rsh -c aodh-api aodh-0 cat /etc/aodh/policy.yaml)" = "custom config contents"
  - script: >
      test "$(oc -n $NAMESPACE rsh -c aodh-evaluator aodh-0 cat /etc/aodh/policy.yaml)" = "custom config contents"
  - script: >
      test "$(oc -n $NAMESPACE rsh -c aodh-listener aodh-0 cat /etc/aodh/policy.yaml)" = "custom config contents"
  - script: >
      test "$(oc -n $NAMESPACE rsh -c aodh-notifier aodh-0 cat /etc/aodh/policy.yaml)" = "custom config contents"
