apiVersion: v1
kind: Pod
metadata:
  labels:
    service: ceilometer
  name: ceilometer-0
  ownerReferences:
  - kind: StatefulSet
    name: ceilometer
spec:
  containers:
  - name: ceilometer-central-agent
    volumeMounts:
    - mountPath: /etc/ceilometer/ceilometer.conf
      name: config-data
      subPath: ceilometer.conf
    - mountPath: /etc/ceilometer/polling.yaml
      name: custom-config
      subPath: polling.yaml
    - mountPath: /etc/ceilometer/ceilometer.conf.d/01-ceilometer-custom.conf
      name: config-data
      subPath: custom.conf
    - mountPath: /var/lib/openstack/bin/centralhealth.py
      name: scripts
      subPath: centralhealth.py
    - mountPath: /var/lib/openstack/bin/notificationhealth.py
      name: scripts
      subPath: notificationhealth.py
  - name: ceilometer-notification-agent
    volumeMounts:
    - mountPath: /etc/ceilometer/ceilometer.conf
      name: config-data
      subPath: ceilometer.conf
    - mountPath: /etc/ceilometer/pipeline.yaml
      name: config-data
      subPath: pipeline.yaml
    - mountPath: /etc/ceilometer/event_pipeline.yaml
      name: config-data
      subPath: event_pipeline.yaml
    - mountPath: /etc/ceilometer/ceilometer.conf.d/01-ceilometer-custom.conf
      name: config-data
      subPath: custom.conf
    - mountPath: /etc/ceilometer/polling.yaml
      name: custom-config
      subPath: polling.yaml
    - mountPath: /var/lib/openstack/bin/centralhealth.py
      name: scripts
      subPath: centralhealth.py
    - mountPath: /var/lib/openstack/bin/notificationhealth.py
      name: scripts
      subPath: notificationhealth.py
  - name: sg-core
  - name: proxy-httpd
  volumes:
  - name: scripts
    secret:
      secretName: ceilometer-scripts
  - name: config-data
    secret:
      secretName: ceilometer-config-data
  - name: sg-core-conf-yaml
    secret:
      items:
      - key: sg-core.conf.yaml
        path: sg-core.conf.yaml
      secretName: ceilometer-config-data
  - emptyDir: {}
    name: run-httpd
  - emptyDir: {}
    name: var-log-httpd
  - name: custom-config
    secret:
      secretName: custom-config
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
- script: >
    test "$(oc -n $NAMESPACE rsh -c ceilometer-notification-agent ceilometer-0 cat /etc/ceilometer/polling.yaml)" = "custom config contents"
- script: >
    test "$(oc -n $NAMESPACE rsh -c ceilometer-central-agent ceilometer-0 cat /etc/ceilometer/polling.yaml)" = "custom config contents"
