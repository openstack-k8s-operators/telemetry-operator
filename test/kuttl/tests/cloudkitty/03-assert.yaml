---
apiVersion: v1
kind: Pod
metadata:
  labels:
    component: cloudkitty-api
    service: cloudkitty
  name: telemetry-kuttl-cloudkitty-api-0
  ownerReferences:
  - kind: StatefulSet
    name: telemetry-kuttl-cloudkitty-api
spec:
  containers:
  - name: telemetry-kuttl-cloudkitty-api-log
  - name: cloudkitty-api
    volumeMounts:
    - mountPath: /etc/cloudkitty/metrics.yaml
      name: custom-config
      subPath: metrics.yaml
    - mountPath: /etc/cloudkitty/certs
      name: certs
    - mountPath: /etc/cloudkitty/cloudkitty.conf.d/00-cloudkitty.conf
      name: config-data-custom
      subPath: cloudkitty.conf
    - mountPath: /etc/cloudkitty/cloudkitty.conf.d/02-global-custom.conf
      name: config-data-custom
      subPath: 02-global-custom.conf
    - mountPath: /etc/cloudkitty/cloudkitty.conf.d/03-service-custom.conf
      name: config-data-custom
      subPath: 03-service-custom.conf
    - mountPath: /etc/cloudkitty/cloudkitty.conf.d/04-service-custom-secrets.conf
      name: config-data-custom
      subPath: 04-service-custom-secrets.conf
    - mountPath: /etc/httpd/conf.d/00wsgi-cloudkitty.conf
      name: config-data
      subPath: wsgi-cloudkitty.conf
    - mountPath: /etc/httpd/conf/httpd.conf
      name: config-data
      subPath: httpd.conf
    - mountPath: /etc/httpd/conf.d/ssl.conf
      name: config-data
      subPath: ssl.conf
    - mountPath: /run/httpd
      name: run-httpd
    - mountPath: /var/log/httpd
      name: var-log-httpd
    - mountPath: /var/log/cloudkitty
      name: logs
  volumes:
  - name: config-data
    secret:
      secretName: telemetry-kuttl-cloudkitty-config-data
  - name: certs
    projected:
      sources:
      - secret:
          name: cert-cloudkitty-client-internal
      - configMap:
          name: telemetry-kuttl-cloudkitty-lokistack-gateway-ca-bundle
  - name: config-data-custom
    secret:
      secretName: telemetry-kuttl-cloudkitty-api-config-data
  - emptyDir: {}
    name: logs
  - emptyDir: {}
    name: run-httpd
  - emptyDir: {}
    name: var-log-httpd
  - name: custom-config
    secret:
      secretName: custom-config
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    component: cloudkitty-proc
    service: cloudkitty
  name: telemetry-kuttl-cloudkitty-proc-0
  ownerReferences:
  - kind: StatefulSet
    name: telemetry-kuttl-cloudkitty-proc
spec:
  containers:
  - name: cloudkitty-proc
    volumeMounts:
    - mountPath: /etc/cloudkitty/metrics.yaml
      name: custom-config
      subPath: metrics.yaml
    - mountPath: /etc/cloudkitty/certs
      name: certs
    - mountPath: /etc/cloudkitty/cloudkitty.conf.d/00-cloudkitty.conf
      name: config-data-custom
      subPath: cloudkitty.conf
    - mountPath: /etc/cloudkitty/cloudkitty.conf.d/02-global-custom.conf
      name: config-data-custom
      subPath: 02-global-custom.conf
    - mountPath: /etc/cloudkitty/cloudkitty.conf.d/03-service-custom.conf
      name: config-data-custom
      subPath: 03-service-custom.conf
    - mountPath: /etc/cloudkitty/cloudkitty.conf.d/04-service-custom-secrets.conf
      name: config-data-custom
      subPath: 04-service-custom-secrets.conf
  volumes:
  - name: config-data
    secret:
      secretName: telemetry-kuttl-cloudkitty-config-data
  - name: certs
    projected:
      sources:
      - secret:
          name: cert-cloudkitty-client-internal
      - configMap:
          name: telemetry-kuttl-cloudkitty-lokistack-gateway-ca-bundle
  - name: config-data-custom
    secret:
      secretName: telemetry-kuttl-cloudkitty-proc-config-data
  - name: custom-config
    secret:
      secretName: custom-config
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: >
      test "$(oc -n $NAMESPACE rsh -c cloudkitty-api telemetry-kuttl-cloudkitty-api-0 cat /etc/cloudkitty/metrics.yaml)" = "custom config contents"
  - script: >
      test "$(oc -n $NAMESPACE rsh -c cloudkitty-proc telemetry-kuttl-cloudkitty-proc-0 cat /etc/cloudkitty/metrics.yaml)" = "custom config contents"
